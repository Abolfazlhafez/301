<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9142"/>
      <stop offset="55%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E85F00"/>
    </linearGradient>
    <linearGradient id="dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323F55"/>
      <stop offset="100%" stop-color="#131924"/>
    </linearGradient>
    <linearGradient id="brim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DEE4EC"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- پس‌زمینه: مربع نرم‌گوشه با گرادیان ظریف نارنجی، به‌جای رنگ تخت یک‌دست قبلی -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect width="100" height="100" rx="24" fill="url(#sheen)"/>

  <!-- بدنه اصلی: کلاه ایمنی با یک سیلوئت ساده و پرکنتراست (خوانا حتی در
       سایزهای خیلی کوچک مثل فاوآیکون ۱۶ پیکسلی)، همراه با گرادیان ظریف برای
       حس عمق در سایزهای بزرگ‌تر — به‌جای شکل‌های کاملاً تخت نسخهٔ قبلی. -->
  <path
    d="M 20 52.5
       A 30 30 0 0 1 80 52.5
       L 80 55.5 A 30.5 6.2 0 0 1 50 61.7
       A 30.5 6.2 0 0 1 20 55.5
       Z"
    fill="url(#dome)"
  />

  <!-- خط تهویه بالای کلاه، حالا کاملاً ادغام‌شده در سیلوئت گنبد (نه بیرون‌زده) -->
  <rect x="45.5" y="25" width="9" height="17" rx="4.5" fill="url(#bg)"/>

  <!-- لبهٔ کلاه — یک بیضی ضخیم‌تر و پرکنتراست‌تر از نسخهٔ قبلی برای این‌که در
       سایز کوچک هم به‌وضوح از گنبد تیره جدا دیده شود. -->
  <ellipse cx="50" cy="55.5" rx="31.5" ry="6.4" fill="url(#brim)"/>
</svg>
